name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make build-all
      - run: cd bin && sha256sum * > SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" bin/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
